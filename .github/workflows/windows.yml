name: windows
on:
  push:
    branches: [windows, main]
    paths: [Engine/**, Tools/autoswitch/**, Windows/**, .github/workflows/windows.yml]
  pull_request:
    paths: [Engine/**, Tools/autoswitch/**, Windows/**, .github/workflows/windows.yml]
  workflow_dispatch:
jobs:
  engine:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ninja
        run: choco install ninja -y --no-progress
        shell: pwsh
      - name: Engine lock (rule cases, golden, Telex lock, driver parity, perf)
        run: pwsh Windows/check.ps1
        shell: pwsh
      - name: Build app (when present)
        if: hashFiles('Windows/App/CMakeLists.txt') != ''
        run: cmake --build Windows/build --config Release --target vikey
        shell: pwsh
      - uses: actions/upload-artifact@v4
        if: hashFiles('Windows/App/CMakeLists.txt') != ''
        with:
          name: Vikey-windows-${{ matrix.arch }}
          path: Windows/build/App/Vikey.exe
